    <path d="M15.89 40.03A18 18 0 0 1 15.89 23.97" stroke="#F87171"/>
    <path d="M16.99 22.07A18 18 0 0 1 30.90 14.03" stroke="#60A5FA"/>
  </g>
  <circle cx="32" cy="14" r="7" fill="url(#halo)"/>
  <circle cx="32" cy="14" r="3" fill="#fff"/>
</svg>
