    <radialGradient id="halo"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ciel)"/>
  <circle cx="14" cy="50" r=".9" fill="#fff" opacity=".5"/><circle cx="51" cy="14" r=".7" fill="#fff" opacity=".45"/><circle cx="48" cy="52" r=".6" fill="#fff" opacity=".35"/>
  <g fill="none" stroke-width="6.5" stroke-linecap="butt">
        <path d="M33.10 14.03A18 18 0 0 1 47.01 22.07" stroke="#A78BFA"/>
    <path d="M48.11 23.97A18 18 0 0 1 48.11 40.03" stroke="#FB923C"/>
